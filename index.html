<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>Fatmanur Bakar — Portfolio</title>

<style>
  :root {
    --bg:      #1c1c1e;   
    --bg-2:    #232326;   
    --bone:    #d9d0c1;   
    --ash:     #8a8278;   
    --blood:   #7d1f1f;   
    --silver:  #b4b8bf;   
    --line:    #333338;
    --display: "Times New Roman", Times, serif;
    --body:    "Times New Roman", Times, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  section, header, .gallery { scroll-margin-top: 4.5rem; }
  img { max-width: 100%; }

  body {
    background: var(--bg);
    color: var(--bone);
    font-family: var(--body);
    font-size: .95rem;
    line-height: 1.65;
    overflow-x: hidden;
  }

  /* vingette */
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.35) 100%);
    z-index: 5;
  }

  /* nav */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.1rem 2rem;
    background: linear-gradient(to bottom, rgba(28,28,30,.95), rgba(28,28,30,0));
  }
  .sigil {
    font-family: var(--display); font-weight: 800;
    letter-spacing: .3em; color: var(--silver); text-decoration: none;
  }
  nav ul { display: flex; gap: 1.8rem; list-style: none; }
  nav ul a {
    font-family: var(--display); font-size: .72rem;
    letter-spacing: .25em; text-transform: uppercase;
    color: var(--ash); text-decoration: none;
    transition: color .3s;
  }
  nav ul a:hover, nav ul a:focus-visible { color: var(--bone); }

  /* hero */
  .hero {
    min-height: 100vh;
    min-height: 100svh;   /* telefonda adres cubugu ziplamasin */
    display: grid; place-items: center; text-align: center;
    padding: 6rem 1.5rem;
    background: var(--bg);
  }
  .hero small {
    display: block;
    font-family: var(--display); font-size: .75rem;
    letter-spacing: .5em; text-transform: uppercase; color: var(--silver);
  }
  .hero h1 {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(1.5rem, 4vw, 2.6rem);
    line-height: 1; letter-spacing: .06em;
    margin: 1.2rem 0;
    text-shadow: 0 0 60px rgba(125,31,31,.6);
  }
  .hero p { color: var(--ash); max-width: 34ch; margin: 0 auto; }
  .scroll-hint {
    display: block; margin-top: 4rem;
    font-family: var(--display); font-size: .65rem; letter-spacing: .4em;
    color: var(--ash); text-decoration: none;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .3; transform: translateY(6px); } }

  /* sections */
  section { padding: 7rem 1.5rem; max-width: 1150px; margin: 0 auto; }

  .section-head { text-align: center; margin-bottom: 4rem; }
  .section-head h2 {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(1.3rem, 2.6vw, 1.8rem); letter-spacing: .3em;
  }
  .section-head::after {
    content: "✦";
    display: block; margin-top: 1rem; color: var(--silver);
  }

  /* gallery */
  .gallery {
    max-width: 900px; margin: 0 auto;
    padding: 4rem 1.5rem 6rem;
    display: flex; flex-direction: column; align-items: center;
    gap: 7rem;                       /* gap between pieces */
  }
  .piece {
    width: 100%; margin: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: .8rem;                      /* gap between images in a piece */
  }
  .piece img {
    display: block;
    max-width: 100%; max-height: 82vh;
    width: auto; height: auto;
    box-shadow: 0 25px 70px rgba(0,0,0,.75);
  }

  /* 2 images, same height */
  .pair {
    display: flex; gap: .8rem; width: 100%;
    justify-content: center; align-items: flex-start;
    max-width: calc(min(78vh, 680px) * var(--total) + .8rem);
  }
  .pair > * { flex: var(--r) 1 0; min-width: 0; margin: 0; }
  .pair img { width: 100%; max-height: none; }

  /* 3 images, same height */
  .trio {
    display: flex; align-items: flex-end; justify-content: center;
    gap: 1.5rem; width: 100%;
    max-width: calc(min(70vh, 520px) * var(--total) + 3rem);
  }
  .trio > * { flex: var(--r) 1 0; min-width: 0; }
  .piece .trio img { width: 100%; max-height: none; box-shadow: none; }

  figcaption { text-align: center; margin-top: .6rem; }
  figcaption .title {
    display: block;
    font-family: var(--display); font-size: .78rem;
    letter-spacing: .28em; text-transform: uppercase; color: var(--bone);
  }
  figcaption .meta {
    display: block; margin-top: .25rem;
    font-size: .74rem; letter-spacing: .08em; color: var(--ash);
  }

  /* about */
  .about {
    max-width: 640px; margin: 0 auto; text-align: center;
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 3rem;
  }
  .about h3 {
    font-family: var(--display); font-size: 1.3rem;
    letter-spacing: .1em; margin-bottom: 1rem;
  }
  .about p { color: var(--ash); margin: 0 auto 1rem; max-width: 46ch; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; margin-top: 1.5rem; }
  .links a.email { text-transform: none; letter-spacing: .08em; font-size: .85rem; overflow-wrap: anywhere; }
  .links a {
    font-family: var(--display); font-size: .7rem;
    letter-spacing: .25em; text-transform: uppercase;
    color: var(--bone); text-decoration: none;
    border-bottom: 1px solid var(--blood); padding-bottom: .2rem;
    transition: color .3s, border-color .3s;
  }
  .links a:hover, .links a:focus-visible { color: var(--silver); border-color: var(--silver); }

  footer {
    text-align: center; padding: 3rem 1rem;
    font-family: var(--display); font-size: .65rem;
    letter-spacing: .3em; color: var(--ash);
    border-top: 1px solid var(--line);
  }

  a:focus-visible { outline: 1px solid var(--silver); outline-offset: 4px; }

  /* fade in */
  .reveal {
    opacity: 0;
    transform: translateY(50px);
    filter: blur(6px);
    transition: opacity 1.4s ease, transform 1.4s ease, filter 1.4s ease;
  }
  .reveal.visible { opacity: 1; transform: none; filter: none; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; filter: none; transition: none; }
    .scroll-hint { animation: none; }
    html { scroll-behavior: auto; }
  }

  /* tablet */
  @media (max-width: 1000px) {
    section { padding: 6rem 1.5rem; }
    .about { padding: 2.2rem; }
  }

  /* phone */
  @media (max-width: 760px) {
    body { font-size: 1rem; }
    nav {
      flex-direction: column; gap: .2rem;
      padding: .7rem 1rem .9rem;
      padding-top: calc(.7rem + env(safe-area-inset-top));
      background: linear-gradient(to bottom, rgba(28,28,30,.97) 70%, rgba(28,28,30,0));
    }
    nav ul { gap: 0; flex-wrap: wrap; justify-content: center; }
    nav ul a {
      display: block; padding: .6rem .55rem;
      font-size: .62rem; letter-spacing: .14em;
    }
    .hero { padding: 7rem 1.25rem 4rem; }
    .hero small { font-size: .65rem; letter-spacing: .3em; }
    .hero h1 { letter-spacing: .03em; overflow-wrap: anywhere; }
    .scroll-hint { margin-top: 3rem; padding: .8rem; }
    section { padding: 4rem 1.25rem; }
    .section-head { margin-bottom: 3rem; }
    .gallery { padding: 2rem 1.25rem 4rem; gap: 4.5rem; }
    .pair { gap: .5rem; }
    .piece { gap: .5rem; }
    .trio { gap: .6rem; }
    .piece img { box-shadow: 0 15px 40px rgba(0,0,0,.7); }
    .about { padding: 2rem 1.25rem; }
    .about p { margin-left: auto; margin-right: auto; }
    .links { justify-content: center; gap: .6rem 1.4rem; }
    .links a { padding: .5rem 0 .3rem; }
    .reveal { transform: translateY(30px); }
    footer { padding: 2.5rem 1rem calc(2.5rem + env(safe-area-inset-bottom)); letter-spacing: .2em; }
  }

  /* thin phone */
  @media (max-width: 360px) {
    nav ul a { padding: .6rem .35rem; font-size: .58rem; letter-spacing: .08em; }
    section { padding: 3.5rem 1rem; }
    .gallery { padding-left: 1rem; padding-right: 1rem; }
  }
</style>
</head>
<body>

<script>
  // start from beginning on page reload, not where the user left off
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  window.addEventListener('load', () => window.scrollTo({ top: 0, behavior: 'instant' }));

  // fade in on scroll
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
</script>
